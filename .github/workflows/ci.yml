name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  check-quality:
    runs-on: ubuntu-latest
    env:
      DIALOG_BASE_URL: "https://api.example.com"
      DIALOG_CLIENT_ID: "test-client-id"
      DIALOG_CLIENT_SECRET: "test-client-secret"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: make app:build-ci

      - name: Generate client
        run: make api:generate-client

      - name: Check formatting
        run: make app:format-check

      - name: Check linting
        run: make app:lint

      - name: Check typing
        run: make app:type

      - name: Run tests
        run: make app:test