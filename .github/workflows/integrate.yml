name: integrate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      organization:
        description: "Only this organization (empty: every organization of integrations.toml)"
        required: false
        default: ""
      force_deletions:
        description: "Release the closures or deletions held by a cap or a volume drop (needs an organization)"
        type: boolean
        default: false

# A second run waits for the first: both would read the identifiers before either
# creates, and post the same regulations twice.
concurrency:
  group: integrate
  cancel-in-progress: false

jobs:
  # The matrix is read from integrations.toml: adding, promoting or pausing an
  # organization never touches this file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
      organizations: ${{ steps.registry.outputs.organizations }}
    steps:
      - uses: actions/checkout@v5
      - name: Read integrations.toml
        id: registry
        # Inputs go through the environment, never pasted into the script.
        env:
          ONLY: ${{ inputs.organization }}
          FORCE: ${{ inputs.force_deletions }}
        run: |
          if [ "$FORCE" = "true" ] && [ -z "$ONLY" ]; then
            echo "force_deletions releases one organization at a time: name it" >&2
            exit 1
          fi
          echo "matrix=$(python3 registry.py matrix ${ONLY:+"$ONLY"})" >> "$GITHUB_OUTPUT"
          echo "organizations=$(python3 registry.py organizations ${ONLY:+"$ONLY"})" >> "$GITHUB_OUTPUT"

  integrate:
    runs-on: ubuntu-latest
    needs: plan
    # Twice the longest job seen (31 min, dp_aveyron, September 2026). The default is six
    # hours, and with two jobs at a time a hung one holds back the whole matrix.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    environment: ${{ matrix.target == 'prod' && matrix.organization || format('{0}-{1}', matrix.organization, matrix.target) }}

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # The snapshot of what was last sent, used to detect updates. A missing snapshot
      # costs one day of updates, never a mass rewrite: the run rebuilds it.
      # A fresh key every run so the post-step always saves; restore-keys picks up
      # yesterday's. Caches are evicted after 7 days without use. The target is part of
      # the key: what was sent to staging says nothing about production.
      - name: Restore synchronization state for ${{ matrix.organization }} (${{ matrix.target }})
        uses: actions/cache@v5
        with:
          path: state
          key: dialog-state-${{ matrix.organization }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            dialog-state-${{ matrix.organization }}-${{ matrix.target }}-

      - name: Install dependencies
        run: make app:build-ci

      - name: Generate API client
        run: make api:generate-client

      - name: Run integration for ${{ matrix.organization }} (${{ matrix.target }})
        id: integration
        env:
          DIALOG_BASE_URL: ${{ secrets.DIALOG_BASE_URL }}
          DIALOG_CLIENT_ID: ${{ secrets.DIALOG_CLIENT_ID }}
          DIALOG_CLIENT_SECRET: ${{ secrets.DIALOG_CLIENT_SECRET }}
          # Source credentials, set only in the environments that need them (co_paris).
          EUDONET_PARIS_CREDENTIALS: ${{ secrets.EUDONET_PARIS_CREDENTIALS }}
          FORCE: ${{ inputs.force_deletions }}
        # `--json` prints the run counters on stdout (the logs stay on stderr); they go
        # to a file named after this org, gathered by the notify job.
        run: |
          org="${{ matrix.organization }}"
          # --summary: the run's counters, funnel, alerts and errors. Written to a file
          # rather than to this job's summary: the notify job gathers them all into
          # one document, in matrix order (hence the job index in the name).
          summary="$(printf 'summary-%02d-%s.md' "${{ strategy.job-index }}" "$org")"
          release=""
          if [ "$FORCE" = "true" ]; then release="--force-deletions"; fi
          if uv run dialog integrate "$org" --json --summary "$summary" $release > result.json; then
            result="$(tr -d '\n' < result.json)"
            if [ -z "$result" ]; then
              result='{"success":true}'
            fi
          else
            # A crash still prints {"success":false,"target":...}; an empty file means
            # the command died before it could.
            result="$(tr -d '\n' < result.json)"
            if [ -z "$result" ]; then
              result='{"success":false}'
            fi
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          printf '%s' "$result" > "result_${org}.json"
      - name: Upload the result for the notify job
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.organization }}
          path: result_*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the run summary for the notify job
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: summary-${{ strategy.job-index }}-${{ matrix.organization }}
          path: summary-*.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail job if integration failed
        if: ${{ steps.integration.outputs.failed == 'true' }}
        run: exit 1

  notify:
    runs-on: ubuntu-latest
    needs: [plan, integrate]
    # Not when the plan itself failed: there is no list of organizations to report on.
    if: always() && needs.plan.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: make app:build-ci

      - name: Generate API client
        run: make api:generate-client

      - name: Gather the summaries of every organization
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: true

      - name: Gather the results of every organization
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Publish one report for the whole run
        if: always()
        id: report
        # One document, in matrix order: on this job's summary, and as an artifact
        # named by date. Each organization's synchronization report stays folded.
        run: |
          day="$(date -u +%Y-%m-%d)"
          report="rapport-${day}.md"
          {
            echo "# Intégrations du ${day} — run ${{ github.run_id }}"
            echo
            for file in $(ls summaries/summary-*.md 2>/dev/null | sort); do
              cat "$file"
              echo
            done
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "name=rapport-${day}" >> "$GITHUB_OUTPUT"
          echo "path=${report}" >> "$GITHUB_OUTPUT"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.report.outputs.name }}
          path: ${{ steps.report.outputs.path }}
          retention-days: 30

      - name: Notify Tchap
        if: always()
        env:
          TCHAP_HOMESERVER_URL: ${{ secrets.TCHAP_HOMESERVER_URL }}
          TCHAP_ROOM_ID: ${{ secrets.TCHAP_ROOM_ID }}
          TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
          # An organization of the plan without a result file is reported as failed.
          EXPECTED: ${{ needs.plan.outputs.organizations }}
        run: |
          mkdir -p results
          uv run dialog notify --results-dir results --expected "$EXPECTED"
