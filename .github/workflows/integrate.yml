name: integrate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `target` names the DiaLog instance the organization writes to. The GitHub
      # environment holding its secrets is the organization for `prod` (`co_brest`),
      # suffixed otherwise (`co_paris-staging`). Promoting an organization means
      # flipping its target; its snapshot then starts afresh.
      matrix:
        include:
          - { organization: co_brest, target: prod }
          - { organization: dp_sarthe, target: prod }
          - { organization: co_rennes, target: prod }
          - { organization: dp_aveyron, target: prod }
          - { organization: co_issy-les-moulineaux, target: prod }
    environment: ${{ matrix.target == 'prod' && matrix.organization || format('{0}-{1}', matrix.organization, matrix.target) }}
    outputs:
      # One output per matrix value — names must be static
      result_co_brest:   ${{ steps.integration.outputs.result_co_brest }}
      result_dp_sarthe:  ${{ steps.integration.outputs.result_dp_sarthe }}
      result_co_rennes:  ${{ steps.integration.outputs.result_co_rennes }}
      result_dp_aveyron: ${{ steps.integration.outputs.result_dp_aveyron }}
      result_co_issy-les-moulineaux: ${{ steps.integration.outputs['result_co_issy-les-moulineaux'] }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # The snapshot of what was last sent, used to detect updates. A missing snapshot
      # costs one day of updates, never a mass rewrite: the run rebuilds it.
      # A fresh key every run so the post-step always saves; restore-keys picks up
      # yesterday's. Caches are evicted after 7 days without use. The target is part of
      # the key: what was sent to staging says nothing about production.
      - name: Restore synchronization state for ${{ matrix.organization }} (${{ matrix.target }})
        uses: actions/cache@v4
        with:
          path: state
          key: dialog-state-${{ matrix.organization }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            dialog-state-${{ matrix.organization }}-${{ matrix.target }}-

      - name: Install dependencies
        run: make app:build-ci

      - name: Generate API client
        run: make api:generate-client

      - name: Run integration for ${{ matrix.organization }} (${{ matrix.target }})
        id: integration
        env:
          DIALOG_BASE_URL: ${{ secrets.DIALOG_BASE_URL }}
          DIALOG_CLIENT_ID: ${{ secrets.DIALOG_CLIENT_ID }}
          DIALOG_CLIENT_SECRET: ${{ secrets.DIALOG_CLIENT_SECRET }}
        # Write a JSON result to the step output named after this org.
        # `--json` prints the run counters on stdout; the logs stay on stderr.
        run: |
          org="${{ matrix.organization }}"
          if uv run dialog integrate "$org" --json > result.json; then
            result="$(tr -d '\n' < result.json)"
            if [ -z "$result" ]; then
              result='{"success":true}'
            fi
          else
            result='{"success":false}'
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "result_${org}=${result}" >> "$GITHUB_OUTPUT"
      - name: Fail job if integration failed
        if: ${{ steps.integration.outputs.failed == 'true' }}
        run: exit 1

  notify:
    runs-on: ubuntu-latest
    needs: integrate
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make app:build-ci

      - name: Generate API client
        run: make api:generate-client

      - name: Notify Tchap
        env:
          TCHAP_HOMESERVER_URL: ${{ secrets.TCHAP_HOMESERVER_URL }}
          TCHAP_ROOM_ID: ${{ secrets.TCHAP_ROOM_ID }}
          TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
        run: |
          uv run dialog notify --results '${{ toJson(needs.integrate.outputs) }}'
