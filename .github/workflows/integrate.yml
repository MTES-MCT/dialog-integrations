name: integrate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two organizations at a time: at midnight the staging jobs all fetched their
      # identifiers within the same second, and the review-sized instance answered one
      # of them 500 (co_rennes, 2026-09-19). The run is not time-critical.
      max-parallel: 2
      # `target` names the DiaLog instance the organization writes to. The GitHub
      # environment holding its secrets is the organization for `prod` (`co_brest`),
      # suffixed otherwise (`co_paris-staging`). Promoting an organization means
      # flipping its target; its snapshot then starts afresh.
      matrix:
        include:
          - { organization: co_brest, target: prod }
          - { organization: dp_sarthe, target: prod }
          - { organization: co_issy-les-moulineaux, target: prod }
          # Under review on the staging: never written to production by this workflow.
          - { organization: dp_aveyron, target: staging }
          - { organization: co_lyon, target: staging }
          - { organization: co_rennes, target: staging }
          - { organization: co_nantes, target: staging }
    environment: ${{ matrix.target == 'prod' && matrix.organization || format('{0}-{1}', matrix.organization, matrix.target) }}
    outputs:
      # One output per matrix value — names must be static
      result_co_brest:   ${{ steps.integration.outputs.result_co_brest }}
      result_dp_sarthe:  ${{ steps.integration.outputs.result_dp_sarthe }}
      result_co_issy-les-moulineaux: ${{ steps.integration.outputs['result_co_issy-les-moulineaux'] }}
      result_dp_aveyron: ${{ steps.integration.outputs.result_dp_aveyron }}
      result_co_lyon:    ${{ steps.integration.outputs.result_co_lyon }}
      result_co_rennes:  ${{ steps.integration.outputs.result_co_rennes }}
      result_co_nantes:  ${{ steps.integration.outputs.result_co_nantes }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # The snapshot of what was last sent, used to detect updates. A missing snapshot
      # costs one day of updates, never a mass rewrite: the run rebuilds it.
      # A fresh key every run so the post-step always saves; restore-keys picks up
      # yesterday's. Caches are evicted after 7 days without use. The target is part of
      # the key: what was sent to staging says nothing about production.
      - name: Restore synchronization state for ${{ matrix.organization }} (${{ matrix.target }})
        uses: actions/cache@v4
        with:
          path: state
          key: dialog-state-${{ matrix.organization }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            dialog-state-${{ matrix.organization }}-${{ matrix.target }}-

      - name: Install dependencies
        run: make app:build-ci

      - name: Generate API client
        run: make api:generate-client

      - name: Run integration for ${{ matrix.organization }} (${{ matrix.target }})
        id: integration
        env:
          DIALOG_BASE_URL: ${{ secrets.DIALOG_BASE_URL }}
          DIALOG_CLIENT_ID: ${{ secrets.DIALOG_CLIENT_ID }}
          DIALOG_CLIENT_SECRET: ${{ secrets.DIALOG_CLIENT_SECRET }}
        # `--json` prints the run counters on stdout (the logs stay on stderr); they go
        # to the step output named after this org.
        run: |
          org="${{ matrix.organization }}"
          # --summary: the run's counters, funnel, alerts and errors. Written to a file
          # rather than to this job's summary: the notify job gathers them all into
          # one document, in matrix order (hence the job index in the name).
          summary="$(printf 'summary-%02d-%s.md' "${{ strategy.job-index }}" "$org")"
          if uv run dialog integrate "$org" --json --summary "$summary" > result.json; then
            result="$(tr -d '\n' < result.json)"
            if [ -z "$result" ]; then
              result='{"success":true}'
            fi
          else
            # A crash still prints {"success":false,"target":...}; an empty file means
            # the command died before it could.
            result="$(tr -d '\n' < result.json)"
            if [ -z "$result" ]; then
              result='{"success":false}'
            fi
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "result_${org}=${result}" >> "$GITHUB_OUTPUT"
      - name: Upload the run summary for the notify job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ strategy.job-index }}-${{ matrix.organization }}
          path: summary-*.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail job if integration failed
        if: ${{ steps.integration.outputs.failed == 'true' }}
        run: exit 1

  notify:
    runs-on: ubuntu-latest
    needs: integrate
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make app:build-ci

      - name: Generate API client
        run: make api:generate-client

      - name: Gather the summaries of every organization
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: true

      - name: Publish one report for the whole run
        if: always()
        id: report
        # One document, in matrix order: on this job's summary, and as an artifact
        # named by date. Each organization's synchronization report stays folded.
        run: |
          day="$(date -u +%Y-%m-%d)"
          report="rapport-${day}.md"
          {
            echo "# Intégrations du ${day} — run ${{ github.run_id }}"
            echo
            for file in $(ls summaries/summary-*.md 2>/dev/null | sort); do
              cat "$file"
              echo
            done
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "name=rapport-${day}" >> "$GITHUB_OUTPUT"
          echo "path=${report}" >> "$GITHUB_OUTPUT"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report.outputs.name }}
          path: ${{ steps.report.outputs.path }}
          retention-days: 30

      - name: Notify Tchap
        env:
          TCHAP_HOMESERVER_URL: ${{ secrets.TCHAP_HOMESERVER_URL }}
          TCHAP_ROOM_ID: ${{ secrets.TCHAP_ROOM_ID }}
          TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
        run: |
          uv run dialog notify --results '${{ toJson(needs.integrate.outputs) }}'
